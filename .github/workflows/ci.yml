name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m py_compile backend/main.py backend/data.py
      # In-memory simulator: the whole suite is offline (no MongoDB, no secrets).
      - run: python -m pytest -q -rs backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:parity
      - run: npm run build
      - run: npm run build:pages
      # UI end-to-end against the GitHub Pages mock (Playwright serves the build itself).
      # The "bridge" mode is left out: it spawns backend/.venv/bin/python by fixed path.
      # sem --with-deps: a imagem do runner já tem as libs do Chrome; o apt do runner falhou por DNS em 2026-11-11
      - run: npx playwright install chromium
      - run: VITE_USE_MOCK=1 npx vite build --outDir /tmp/opsm-dist-mock
      - run: node tests/e2e_ui.mjs mock /tmp/opsm-dist-mock
